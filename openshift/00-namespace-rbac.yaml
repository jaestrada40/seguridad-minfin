# 00 — Identidad del Job de bootstrap de Vault
#
# El Job 05 escribe las llaves de Vault (unseal_key, root_token, backend_token)
# en el Secret `securevault-vault-keys`. Para eso necesita una ServiceAccount
# con permiso de get/create/patch sobre secrets EN ESTE namespace únicamente.
#
# Requiere que el proyecto ya exista (creado con `oc new-project securevault`
# o `oc project securevault` si ya está) — un usuario normal de OpenShift no
# puede crear el objeto Namespace crudo vía API, pero sí Role/RoleBinding
# dentro de un proyecto del que es admin (el que crea el proyecto con
# `oc new-project` queda como admin automáticamente).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: securevault-bootstrap
  namespace: controlcenter
  labels:
    app.kubernetes.io/part-of: securevault
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: securevault-vault-keys-writer
  namespace: controlcenter
  labels:
    app.kubernetes.io/part-of: securevault
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "update"]
    # Sin `resourceNames` porque el Secret puede no existir la primera vez y
    # `create` no admite filtrar por nombre; el Role está acotado al namespace.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: securevault-bootstrap-vault-keys
  namespace: controlcenter
  labels:
    app.kubernetes.io/part-of: securevault
subjects:
  - kind: ServiceAccount
    name: securevault-bootstrap
    namespace: controlcenter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: securevault-vault-keys-writer
