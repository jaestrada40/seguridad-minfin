# 02 — Secret de la aplicación
#
# NO commitees este archivo con valores reales. Generá cada valor por separado:
#   SESSION_SECRET / BACKUP_ENCRYPTION_KEY : openssl rand -base64 48
#   ADMIN_PASSWORD                          : una contraseña fuerte (>= 12)
#
# Alternativa sin escribir el YAML (recomendada):
#   oc create secret generic securevault-app -n securevault \
#     --from-literal=ADMIN_USERNAME='admin.minfin' \
#     --from-literal=ADMIN_PASSWORD='...' \
#     --from-literal=SESSION_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=BACKUP_ENCRYPTION_KEY="$(openssl rand -base64 48)"
#
# El Secret securevault-vault-keys (unseal_key/root_token/backend_token) NO se
# crea acá: lo genera el Job de bootstrap (05) la primera vez.
apiVersion: v1
kind: Secret
metadata:
  name: securevault-app
  namespace: securevault
  labels: {app.kubernetes.io/part-of: securevault}
type: Opaque
stringData:
  ADMIN_USERNAME: "REEMPLAZAR_usuario_admin"
  ADMIN_PASSWORD: "REEMPLAZAR_contrasena_fuerte_min_12"
  SESSION_SECRET: "REEMPLAZAR_openssl_rand_base64_48"
  BACKUP_ENCRYPTION_KEY: "REEMPLAZAR_openssl_rand_base64_48"
