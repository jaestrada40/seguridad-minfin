# 05 — Job de bootstrap de Vault
#
# Inicializa Vault (si hace falta), lo desella, crea la policy + token acotado
# del backend y guarda TODO en el Secret securevault-vault-keys (lo crea).
# Idempotente: si ya está todo, no hace nada. Volvé a correrlo cuando quieras
# (p. ej. si el pod de Vault reinició antes de que existiera el Secret):
#   oc delete job securevault-vault-bootstrap -n securevault --ignore-not-found
#   oc apply -f 05-vault-bootstrap-job.yaml
#
# Reemplazá REGISTRY.
apiVersion: batch/v1
kind: Job
metadata:
  name: securevault-vault-bootstrap
  namespace: securevault
  labels: {app.kubernetes.io/part-of: securevault}
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: securevault}
    spec:
      serviceAccountName: securevault-bootstrap
      restartPolicy: Never
      containers:
        - name: bootstrap
          image: REGISTRY/securevault-backend:latest
          command: ["python", "-u", "/scripts/bootstrap.py"]
          env:
            - {name: VAULT_ADDR, value: "http://vault:8200"}
            - {name: KEYS_BACKEND, value: "k8s-secret"}
            - {name: KEYS_SECRET_NAME, value: "securevault-vault-keys"}
          volumeMounts:
            - {name: script, mountPath: /scripts, readOnly: true}
          resources:
            requests: {cpu: 20m, memory: 48Mi}
            limits: {cpu: 200m, memory: 128Mi}
      volumes:
        - name: script
          configMap:
            name: securevault-vault-bootstrap
            items: [{key: bootstrap.py, path: bootstrap.py}]
