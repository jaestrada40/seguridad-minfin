# 10 — CronJob de respaldo cifrado de la SQLite (no de Vault).
# Corre una pasada de backup_daemon.py --once cada día a las 03:00.
# Escribe en el PVC securevault-backups (el backend lo monta :ro para el
# "Restaurar desde archivo" de la UI). Reemplazá REGISTRY.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: securevault-backup
  namespace: securevault
  labels: {app.kubernetes.io/part-of: securevault}
spec:
  schedule: "0 3 * * *"
  timeZone: "America/Guatemala"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels: {app.kubernetes.io/part-of: securevault}
        spec:
          restartPolicy: Never
          # Co-localizar con el backend: los PVC son RWO y la mayoría de los CSI
          # permiten multi-mount sólo dentro del mismo nodo. Si usás RWX podés
          # borrar este bloque affinity.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels: {app.kubernetes.io/name: backend}
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: backup
              image: REGISTRY/securevault-backend:latest
              command: ["python", "-u", "scripts/backup_daemon.py", "--once"]
              env:
                - {name: DB_PATH, value: "/data/securevault.db"}
                - {name: BACKUP_DIR, value: "/backups"}
                - {name: BACKUP_RETENTION_COUNT, value: "14"}
                - name: BACKUP_ENCRYPTION_KEY
                  valueFrom:
                    secretKeyRef: {name: securevault-app, key: BACKUP_ENCRYPTION_KEY}
              volumeMounts:
                - {name: data, mountPath: /data, readOnly: true}
                - {name: backups, mountPath: /backups}
              resources:
                requests: {cpu: 20m, memory: 64Mi}
                limits: {cpu: 300m, memory: 192Mi}
          volumes:
            - name: data
              persistentVolumeClaim: {claimName: securevault-backend-data}
            - name: backups
              persistentVolumeClaim: {claimName: securevault-backups}
