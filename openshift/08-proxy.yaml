# 08 — Proxy (Caddy): ruta secreta + 404 falso de nginx + cabeceras.
# El Route (09) termina TLS por delante y manda a este Service en :8080.
# Reemplazá REGISTRY (`caddy` = imagen oficial caddy:2-alpine espejada).
---
apiVersion: v1
kind: Service
metadata:
  name: proxy
  namespace: controlcenter
  labels: {app.kubernetes.io/part-of: securevault, app.kubernetes.io/name: proxy}
spec:
  selector:
    app.kubernetes.io/name: proxy
  ports:
    - {name: http, port: 8080, targetPort: 8080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
  namespace: controlcenter
  labels: {app.kubernetes.io/part-of: securevault, app.kubernetes.io/name: proxy}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: proxy
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: securevault, app.kubernetes.io/name: proxy}
      annotations:
        # fuerza rollout del proxy cuando cambia el Caddyfile:
        checksum/caddyfile: "REEMPLAZAR-O-IGNORAR"
    spec:
      imagePullSecrets:
        - name: srv-osnexus01.minfin.gob.gt
      containers:
        - name: caddy
          image: srv-osnexus01.minfin.gob.gt:8006/caddy:2.7-alpine
          imagePullPolicy: Always
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: APP_SECRET_PATH
              valueFrom:
                configMapKeyRef: {name: securevault-config, key: APP_SECRET_PATH}
            - {name: XDG_CONFIG_HOME, value: /tmp/caddy-config}
            - {name: XDG_DATA_HOME, value: /tmp/caddy-data}
          volumeMounts:
            - {name: caddyfile, mountPath: /etc/caddy, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          readinessProbe:
            # "/" devuelve 404 (a propósito): comprobamos que Caddy responde,
            # no el código. httpGet trata 404 como fallo, así que usamos tcpSocket.
            tcpSocket: {port: 8080}
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 96Mi}
      volumes:
        - name: caddyfile
          configMap:
            name: securevault-proxy-caddyfile
            items: [{key: Caddyfile, path: Caddyfile}]
        - name: tmp
          emptyDir: {}
